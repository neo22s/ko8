name: tests

on:
  push:
    branches: [ko8, main]
  pull_request:

jobs:
  # The framework declares 8.1 support, but the dev tooling does not: PHPUnit 11
  # requires PHP 8.2. So 8.1 gets a real check (it boots the framework, installs
  # the autoloader and renders a page) instead of a test run that cannot install.
  smoke:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo, pdo_sqlite
          coverage: none

      - name: Lint
        run: find system modules application bin tools public -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Boot the framework
        run: php tools/smoke-test.php

  # PHPUnit 11 needs PHP 8.2+, so the suites run there and up.
  test:
    name: suites on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo, pdo_sqlite
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: ko8 suite
        run: composer test

      - name: inherited Kohana/Koseven suite
        run: composer test:legacy

      - name: guide links
        run: composer check:guide
